# sensor-driver component (app/src/sensor_driver.c)
CONFIG_I2C=y
CONFIG_SENSOR=y

# board-io component (app/src/board_io_buzzer.c, app/src/board_io_button.c)
CONFIG_PWM=y
CONFIG_GPIO=y

# --- Communication component (specs/communication.spec.md) ---
# Serial protocol vs. logging: move Zephyr logging to RTT so USART1 (the
# board's console UART) carries only the HELLO/BTN/GESTURE/AXIS/BUZZ/
# PONG/RESET protocol, with no interleaved printk/log output. See
# docs/task-distribution.md "Serial protocol vs. logging".
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_UART=n

# USART1 stays enabled (CONFIG_SERIAL/console Kconfig on) but the protocol
# talks to it directly via the interrupt-driven UART driver API rather than
# the console subsystem -- see comms_transport.c.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# %f in comms_codec.c's snprintf-based line encoder (GESTURE/AXIS confidence
# and value fields) needs picolibc's float printf support enabled.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# RESET command (comms_rx.c) calls sys_reboot().
CONFIG_REBOOT=y

# comms_tx.c services button_evt_q/controller_evt_q via k_poll().
CONFIG_POLL=y
